<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Food Narrator - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%);
            color: var(--dark);
            overflow-x: hidden;
        }
        /* Main Content */
        .main-content {
            margin-left: 110px;
            padding: 2rem;
            min-height: 100vh;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-out;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            padding: 0.875rem 1.5rem 0.875rem 3rem;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 0.95rem;
            width: 300px;
            transition: all 0.3s ease;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .user-menu {
            position: relative;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            background: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow);
            border: none;
        }

        .user-profile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .user-profile .chevron {
            color: #999;
            transition: transform 0.2s ease;
        }

        .user-menu.open .user-profile .chevron {
            transform: rotate(180deg);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .user-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            min-width: 220px;
            background: white;
            border-radius: 16px;
            padding: 0.5rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid var(--border);
            display: none;
            z-index: 20;
        }

        .user-menu.open .user-dropdown {
            display: block;
            animation: fadeIn 0.15s ease-out;
        }

        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .user-dropdown-item:hover {
            background: rgba(255, 107, 53, 0.08);
            color: var(--primary);
        }

        .user-dropdown-item.danger {
            color: var(--danger);
        }

        .user-dropdown-item.danger:hover {
            background: rgba(239, 71, 111, 0.12);
            color: var(--danger);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: var(--gradient);
            opacity: 0.05;
            border-radius: 0 20px 0 100%;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 30px var(--shadow);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }

        .stat-icon.primary {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0.05) 100%);
            color: var(--primary);
        }

        .stat-icon.success {
            background: linear-gradient(135deg, rgba(6, 214, 160, 0.15) 0%, rgba(6, 214, 160, 0.05) 100%);
            color: var(--success);
        }

        .stat-icon.secondary {
            background: linear-gradient(135deg, rgba(0, 78, 137, 0.15) 0%, rgba(0, 78, 137, 0.05) 100%);
            color: var(--secondary);
        }

        .stat-icon.accent {
            background: linear-gradient(135deg, rgba(255, 210, 63, 0.15) 0%, rgba(255, 210, 63, 0.05) 100%);
            color: #E0A800;
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .stat-trend.up {
            background: rgba(6, 214, 160, 0.1);
            color: var(--success);
        }

        .stat-trend.down {
            background: rgba(239, 71, 111, 0.1);
            color: var(--danger);
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
            animation: fadeInUp 0.6s ease-out 0.5s backwards;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--dark);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            background: linear-gradient(to right, #F8F9FA, #F0F4F8);
        }

        th {
            padding: 1rem 1.5rem;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            color: #666;
        }

        tr:hover td {
            background: rgba(255, 107, 53, 0.02);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-badge.active {
            background: rgba(6, 214, 160, 0.15);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(255, 210, 63, 0.15);
            color: #E0A800;
        }

        .status-badge.inactive {
            background: rgba(239, 71, 111, 0.15);
            color: var(--danger);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: var(--success);
        }

        .status-dot.pending {
            background: #E0A800;
        }

        .status-dot.inactive {
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Activity Feed */
        .activity-item {
            display: flex;
            gap: 1rem;
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            transform: translateX(4px);
        }

        .activity-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.25rem;
        }

        .activity-icon.primary {
            background: rgba(255, 107, 53, 0.1);
            color: var(--primary);
        }

        .activity-icon.success {
            background: rgba(6, 214, 160, 0.1);
            color: var(--success);
        }

        .activity-icon.secondary {
            background: rgba(0, 78, 137, 0.1);
            color: var(--secondary);
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .activity-desc {
            font-size: 0.875rem;
            color: #999;
        }

        .activity-time {
            font-size: 0.875rem;
            color: #999;
        }

        /* Mobile Toggle */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
            z-index: 999;
            transition: all 0.3s ease;
        }

        .mobile-toggle:hover {
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.mobile-visible {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .page-title {
                font-size: 2rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
<!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Header -->
        <header class="header">
            <h1 class="page-title">Admin Dashboard</h1>
            <div class="header-actions">
                <div class="search-box">
                    <i class="search-icon fas fa-search"></i>
                    <input type="text" class="search-input" placeholder="Tìm kiếm POI, vendors, audio...">
                </div>
                <div class="user-menu" id="userMenu">
                    <button class="user-profile" id="userMenuToggle" type="button" aria-haspopup="true" aria-expanded="false">
                        <div class="user-avatar" id="userAvatar">AD</div>
                        <span style="font-weight: 600;" id="userName">Admin</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </button>
                    <div class="user-dropdown" id="userDropdown" role="menu">
                        <a href="settings.html" class="user-dropdown-item" role="menuitem">
                            <i class="fas fa-user"></i>
                            <span>Thông tin cá nhân</span>
                        </a>
                        <button class="user-dropdown-item danger" type="button" id="logoutBtn" role="menuitem">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Đăng xuất</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon primary">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
</div>
                <div class="stat-value" id="totalPOIs">0</div>
                <div class="stat-label">Tổng số POI</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon success">
                        <i class="fas fa-check-circle"></i>
                    </div>
</div>
                <div class="stat-value" id="activePOIs">0</div>
                <div class="stat-label">POIs Hoạt động</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon secondary">
                        <i class="fas fa-music"></i>
                    </div>
</div>
                <div class="stat-value" id="totalAudios">0</div>
                <div class="stat-label">Tổng Audio Files</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon accent">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
</div>
                <div class="stat-value" id="poisWithoutAudio">0</div>
                <div class="stat-label">POIs Thiếu Audio</div>
            </div>
        </section>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Recent POIs -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">POI gần đây</h2>
                    <a href="poi-list.html" class="btn btn-outline">
                        <span>Xem tất cả</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
                <div class="table-container">
                    <table id="poisTable">
                        <thead>
                            <tr>
                                <th>Tên POI</th>
                                <th>Địa chỉ</th>
                                <th>Trạng thái</th>
                                <th>Audio</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="poisTableBody">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 2rem; color: #999;">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Hoạt động gần đây</h2>
                </div>
                <div class="activity-feed" id="activityFeed">
    <div class="activity-item">
        <div class="activity-icon primary">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
        <div class="activity-content">
            <div class="activity-title">Đang tải hoạt động...</div>
            <div class="activity-desc">Vui lòng chờ trong giây lát.</div>
        </div>
        <div class="activity-time">-</div>
    </div>
</div>
            </div>
        </div>
    </main>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" id="mobileToggle">
        <i class="fas fa-bars"></i>
    </button>

    <script src="api.js"></script>
    <script>
        // API instance is already created in api.js
        // Check authentication
        TokenManager.setRoleContext('Admin');
    const user = TokenManager.getUser();
        if (!user || !user.roles?.includes('Admin')) {
            window.location.href = TokenManager.getLoginUrl();
        }

        // Display user info
        if (user) {
            document.getElementById('userName').textContent = user.fullName || user.email;
            const initials = (user.fullName || user.email).substring(0, 2).toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
        }

        // Logout function
        function logout() {
            if (!confirm('Bạn có chắc muốn đăng xuất?')) {
                return;
            }
            TokenManager.logout();
        }

        const userMenu = document.getElementById('userMenu');
        const userMenuToggle = document.getElementById('userMenuToggle');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        function closeUserMenu() {
            if (!userMenu) return;
            userMenu.classList.remove('open');
            if (userMenuToggle) userMenuToggle.setAttribute('aria-expanded', 'false');
        }

        if (userMenuToggle) {
            userMenuToggle.addEventListener('click', (e) => {
                if (!userMenu) return;
                e.stopPropagation();
                const isOpen = userMenu.classList.toggle('open');
                userMenuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                closeUserMenu();
                logout();
            });
        }

        if (userDropdown) {
            userDropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => closeUserMenu());
            });
        }

        document.addEventListener('click', (e) => {
            if (!userMenu) return;
            if (!userMenu.contains(e.target)) {
                closeUserMenu();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUserMenu();
            }
        });

        // Mobile menu toggle
        const mobileToggle = document.getElementById('mobileToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-visible');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('mobile-visible');
                }
            }
        });

        

        async function loadActivityFeed() {
            const feed = document.getElementById('activityFeed');
            if (!feed) return;

            feed.innerHTML = `
                <div class="activity-item">
                    <div class="activity-icon primary">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <div class="activity-content">
                        <div class="activity-title">Đang tải hoạt động...</div>
                        <div class="activity-desc">Vui lòng chờ trong giây lát.</div>
                    </div>
                    <div class="activity-time">-</div>
                </div>
            `;

            try {
                const [poisResp, audiosResp, vendorsResp] = await Promise.all([
                    api.getPOIs(1, 5),
                    api.getAudioList(1, 5),
                    api.getVendors()
                ]);

                const activities = [];

                (poisResp.data || []).forEach(p => {
                    activities.push({
                        type: 'poi',
                        title: 'POI mới được thêm',
                        desc: p.name_Vi || 'POI',
                        time: p.createdAt
                    });
                });

                (audiosResp.data || []).forEach(a => {
                    const poiLabel = a.poiName ? `POI: ${a.poiName}` : `POI #${a.poi_ID}`;
                    activities.push({
                        type: 'audio',
                        title: 'Audio chưa được upload',
                        desc: a.title || poiLabel,
                        time: a.createdAt
                    });
                });

                const vendors = (vendorsResp.data || [])
                    .slice()
                    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                    .slice(0, 5);

                vendors.forEach(v => {
                    activities.push({
                        type: 'vendor',
                        title: 'Vendor mới đăng ký',
                        desc: v.businessName || v.contactName || `Vendor #${v.vendorId}`,
                        time: v.createdAt
                    });
                });

                activities.sort((a, b) => new Date(b.time) - new Date(a.time));
                const top = activities.slice(0, 5);

                if (top.length == 0) {
                    feed.innerHTML = `
                        <div class="activity-item">
                            <div class="activity-icon secondary">
                                <i class="fas fa-info-circle"></i>
                            </div>
                            <div class="activity-content">
                                <div class="activity-title">Chưa có hoạt động</div>
                                <div class="activity-desc">Dữ liệu sẽ hiển thị khi có phát sinh.</div>
                            </div>
                            <div class="activity-time">-</div>
                        </div>
                    `;
                    return;
                }

                const iconClass = {
                    poi: { icon: 'fa-plus', theme: 'primary' },
                    audio: { icon: 'fa-microphone', theme: 'secondary' },
                    vendor: { icon: 'fa-user-plus', theme: 'success' }
                };

                feed.innerHTML = top.map(item => {
                    const cfg = iconClass[item.type] || iconClass.poi;
                    const timeLabel = item.time ? formatDate(item.time) : '-';
                    return `
                        <div class="activity-item">
                            <div class="activity-icon ${cfg.theme}">
                                <i class="fas ${cfg.icon}"></i>
                            </div>
                            <div class="activity-content">
                                <div class="activity-title">${item.title}</div>
                                <div class="activity-desc">${item.desc || 'Không có mô tả'}</div>
                            </div>
                            <div class="activity-time">${timeLabel}</div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading activity feed:', error);
                feed.innerHTML = `
                    <div class="activity-item">
                        <div class="activity-icon secondary">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="activity-content">
                            <div class="activity-title">Không thể tải hoạt động</div>
                            <div class="activity-desc">${error.message || 'Vui lòng thử lại sau.'}</div>
                        </div>
                        <div class="activity-time">-</div>
                    </div>
                `;
            }
        }
// Load dashboard data from API
        async function loadDashboard() {
            try {
                // Show loading state
                document.getElementById('totalPOIs').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                document.getElementById('activePOIs').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                document.getElementById('totalAudios').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                document.getElementById('poisWithoutAudio').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                // Load POIs data
                const poisData = await api.getPOIs(1, 100); // Get all POIs for stats
                
                // Calculate statistics
                const totalPOIs = poisData.total || 0;
                const activePOIs = poisData.data.filter(p => p.isActive).length;
                const totalAudios = poisData.data.reduce((sum, p) => sum + (p.audioCount || 0), 0);
                const poisWithoutAudio = poisData.data.filter(p => (p.audioCount || 0) === 0).length;

                // Update statistics
                document.getElementById('totalPOIs').textContent = totalPOIs;
                document.getElementById('activePOIs').textContent = activePOIs;
                document.getElementById('totalAudios').textContent = totalAudios;
                document.getElementById('poisWithoutAudio').textContent = poisWithoutAudio;

                // Display recent POIs (first 5)
                displayPOIs(poisData.data.slice(0, 5));

                await loadActivityFeed();

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('totalPOIs').textContent = '0';
                document.getElementById('activePOIs').textContent = '0';
                document.getElementById('totalAudios').textContent = '0';
                document.getElementById('poisWithoutAudio').textContent = '0';
                
                alert('Không thể tải dữ liệu dashboard: ' + error.message);
            }
        }

        function displayPOIs(pois) {
            const tbody = document.getElementById('poisTableBody');

            if (!pois || pois.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 2rem; color: #999;">
                            Chưa có POI nào. <a href="poi-create.html" style="color: var(--primary);">Tạo POI đầu tiên</a>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = pois.map(poi => `
                <tr>
                    <td style="font-weight: 600; color: var(--dark);">${poi.name_Vi || 'N/A'}</td>
                    <td>${poi.address || 'N/A'}</td>
                    <td>
                        <span class="status-badge ${poi.isActive ? 'active' : 'inactive'}">
                            <span class="status-dot ${poi.isActive ? 'active' : 'inactive'}"></span>
                            ${poi.isActive ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>${poi.audioCount || 0}</td>
                    <td>
                        <button class="btn btn-outline" onclick="editPOI(${poi.poI_ID})" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function editPOI(id) {
            window.location.href = `poi-edit.html?id=${id}`;
        }

        // Load dashboard on page load
        loadDashboard();

        // Refresh dashboard every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý POI - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%);
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--border);
            color: var(--dark);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .filter-input,
        .filter-select {
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            background: var(--light);
        }

        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .filter-input.with-icon {
            padding-left: 3rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px var(--shadow);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-item:nth-child(1) { animation-delay: 0.2s; }
        .stat-item:nth-child(2) { animation-delay: 0.3s; }
        .stat-item:nth-child(3) { animation-delay: 0.4s; }
        .stat-item:nth-child(4) { animation-delay: 0.5s; }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        /* POI Table */
        .table-container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
            animation: fadeInUp 0.6s ease-out 0.6s backwards;
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .bulk-actions {
            display: none;
            gap: 0.75rem;
            align-items: center;
        }

        .bulk-actions.active {
            display: flex;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        thead {
            background: linear-gradient(to right, #F8F9FA, #F0F4F8);
        }

        th {
            padding: 0.875rem 0.75rem;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        th:first-child {
            border-radius: 12px 0 0 0;
            width: 40px;
        }

        th:last-child {
            border-radius: 0 12px 0 0;
        }

        /* Định nghĩa độ rộng cho từng cột */
        th:nth-child(2) { width: 16%; } /* POI */
        th:nth-child(3) { width: 17%; } /* Địa chỉ */
        th:nth-child(4) { width: 9%; } /* Danh mục */
        th:nth-child(5) { width: 15%; } /* Giờ mở cửa */
        th:nth-child(6) { width: 9%; } /* SĐT */
        th:nth-child(7) { width: 12%; } /* Giá/Đánh giá */
        th:nth-child(8) { width: 10%; } /* Trạng thái */
        th:nth-child(9) { width: 120px; } /* Hành động */

        td {
            padding: 0.875rem 0.75rem;
            border-bottom: 1px solid var(--border);
            color: #666;
            font-size: 0.85rem;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover td {
            background: rgba(255, 107, 53, 0.02);
        }

        .poi-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .poi-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .poi-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .poi-details h4 {
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .poi-details p {
            font-size: 0.8rem;
            color: #999;
        }

        .truncate {
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.875rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.active {
            background: rgba(6, 214, 160, 0.15);
            color: var(--success);
        }

        .status-badge.inactive {
            background: rgba(239, 71, 111, 0.15);
            color: var(--danger);
        }


        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active { background: var(--success); }
        .status-dot.inactive { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-start;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--light);
            color: var(--dark);
            flex-shrink: 0;
        }

        .btn-icon:hover {
            transform: scale(1.1);
        }

        .btn-icon.edit:hover {
            background: rgba(0, 78, 137, 0.1);
            color: var(--secondary);
        }

        .btn-icon.delete:hover {
            background: rgba(239, 71, 111, 0.1);
            color: var(--danger);
        }

        .app-confirm-overlay{position:fixed;inset:0;background:rgba(26,26,46,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9999;padding:1rem}
        .app-confirm-overlay.active{display:flex}
        .app-confirm{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-width:420px;width:100%;overflow:hidden}
        .app-confirm-header{padding:1rem 1.25rem;border-bottom:1px solid #eee;font-weight:700}
        .app-confirm-body{padding:1.1rem 1.25rem;color:#333;line-height:1.5}
        .app-confirm-actions{display:flex;justify-content:flex-end;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid #eee;background:#fafafa}
        .app-confirm-btn{padding:.55rem .9rem;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:600}
        .app-confirm-btn.primary{background:linear-gradient(135deg,#FF6B35 0%,#004E89 100%);border:none;color:#fff}

        .btn-icon.view:hover {
            background: rgba(255, 107, 53, 0.1);
            color: var(--primary);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: white;
            color: var(--dark);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: transparent;
        }

        .pagination-info {
            color: #666;
            margin: 0 1rem;
        }

        /* Checkbox */
        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .filter-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Quản lý POI</h1>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i>
                    <span>Quay lại</span>
                </button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalPOIsStat">0</div>
                <div class="stat-label">Tổng POI</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activePOIsStat">0</div>
                <div class="stat-label">Đang hoạt động</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="inactivePOIsStat">0</div>
                <div class="stat-label">Đã tắt</div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label class="filter-label">Tìm kiếm</label>
                    <div class="search-wrapper">
                        <i class="search-icon fas fa-search"></i>
                        <input type="text" class="filter-input with-icon" placeholder="Tìm theo tên, địa chỉ..." id="searchInput">
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Danh mục</label>
                    <select class="filter-select" id="categoryFilter">
                        <option value="">Tất cả</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Trạng thái hoạt động</label>
                    <select class="filter-select" id="statusFilter">
                        <option value="">Tất cả</option>
                        <option value="active">Đang hoạt động</option>
                        <option value="inactive">Đã tắt</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Sắp xếp</label>
                    <select class="filter-select" id="sortFilter">
                        <option value="newest">Mới nhất</option>
                        <option value="oldest">Cũ nhất</option>
                        <option value="name-asc">Tên A-Z</option>
                        <option value="name-desc">Tên Z-A</option>
                        <option value="views">Lượt xem</option>
                    </select>
                </div>

                <div class="filter-group">
                    <button class="btn btn-primary" onclick="applyFilters()">
                        <i class="fas fa-filter"></i>
                        Lọc
                    </button>
                </div>
            </div>
        </div>

        <!-- POI Table -->
        <div class="table-container">
            <div class="table-header">
                <h2 class="table-title">Danh sách POI</h2>
                <div class="bulk-actions" id="bulkActions">
                    <span style="color: #666; font-weight: 600;">
                        <span id="selectedCount">0</span> đã chọn
                    </span>
                    <button class="btn btn-outline" onclick="bulkDelete()">
                        <i class="fas fa-trash"></i>
                        Xóa
                    </button>
                </div>
            </div>

            <table id="poiTable">
                <thead>
                    <tr>
                        <th>
                            <input type="checkbox" class="checkbox" id="selectAll" onchange="toggleSelectAll()">
                        </th>
                        <th>POI</th>
                        <th>ĐỊA CHỈ</th>
                        <th>DANH MỤC</th>
                        <th>GIỜ MỞ CỬA</th>
                        <th>SĐT</th>
                        <th>ĐÁNH GIÁ</th>
                        <th>TRẠNG THÁI</th>
                        <th>HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody id="poiTableBody">
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination">
                <button class="pagination-btn" onclick="changePage('prev')">
                    <i class="fas fa-chevron-left"></i>
                </button>
                
                <button class="pagination-btn active">1</button>
                <button class="pagination-btn">2</button>
                <button class="pagination-btn">3</button>
                <span class="pagination-info">...</span>
                <button class="pagination-btn">10</button>
                
                <button class="pagination-btn" onclick="changePage('next')">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // API instance is already created in api.js
        
        // Check authentication
        const user = TokenManager.getUser();
        if (!user) {
            window.location.href = TokenManager.getLoginUrl();
        }

        const roles = user?.roles || [];
        const roleContext = TokenManager.getRoleContext ? TokenManager.getRoleContext() : null;
        const isAdmin = roleContext ? roleContext === 'Admin' : roles.includes('Admin');
        const isVendor = roleContext ? roleContext === 'Vendor' : roles.includes('Vendor');

        let currentPage = 1;
        let currentPageSize = 5;
        let currentSearch = '';
        let currentStatus = null;
        let currentSort = 'newest';
        let currentCategory = null;
        let selectedPOIs = new Set();
        let allPOIs = [];
        let vendorAllPOIs = [];
        let vendorContext = null;
        let categoryCache = [];

        async function ensureVendorContext() {
            if (!isVendor) return null;
            if (vendorContext) return vendorContext;
            try {
                vendorContext = await api.getVendorMe();
            } catch {
                vendorContext = null;
            }
            return vendorContext;
        }

        // Load POIs from API
        async function loadPOIs() {
            try {
                const tbody = document.getElementById('poiTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 2rem;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                            <p style="margin-top: 1rem; color: #999;">Đang tải dữ liệu...</p>
                        </td>
                    </tr>
                `;

                let data = null;
                if (isVendor) {
                    const vendor = await ensureVendorContext();
                    const vendorId = vendor?.vendorId ?? null;
                    if (vendorId === null) {
                        vendorAllPOIs = [];
                    } else {
                    const raw = await api.getPOIs(1, 5000, currentSearch, currentStatus, currentCategory);
                    const all = raw.data || [];
                    vendorAllPOIs = all.filter(p => p.vendorId === vendorId);
                    vendorAllPOIs = sortPois(vendorAllPOIs, currentSort);
                    }
                    const total = vendorAllPOIs.length;
                    const totalPages = Math.max(1, Math.ceil(total / currentPageSize));
                    const safePage = Math.min(Math.max(1, currentPage), totalPages);
                    currentPage = safePage;
                    const start = (safePage - 1) * currentPageSize;
                    const paged = vendorAllPOIs.slice(start, start + currentPageSize);
                    data = { data: paged, totalPages, page: safePage };
                } else {
                    const raw = await api.getPOIs(1, 5000, currentSearch, currentStatus, currentCategory);
                    const all = sortPois(raw.data || [], currentSort);
                    const total = all.length;
                    const totalPages = Math.max(1, Math.ceil(total / currentPageSize));
                    const safePage = Math.min(Math.max(1, currentPage), totalPages);
                    currentPage = safePage;
                    const start = (safePage - 1) * currentPageSize;
                    const paged = all.slice(start, start + currentPageSize);
                    data = { data: paged, totalPages, page: safePage };
                    vendorAllPOIs = [];
                    updateCategoryFilter(all);
                }

                allPOIs = data.data || [];
                if (isVendor) updateCategoryFilter(data.data || []);
                renderTable(allPOIs);
                renderPagination(data.totalPages, data.page);
                await loadPOIStats();

            } catch (error) {
                console.error('Error loading POIs:', error);
                const tbody = document.getElementById('poiTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 2rem; color: var(--danger);">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i>
                            <p style="margin-top: 1rem;">Không thể tải dữ liệu: ${error.message}</p>
                            <button class="btn btn-primary" onclick="loadPOIs()" style="margin-top: 1rem;">
                                <i class="fas fa-redo"></i> Thử lại
                            </button>
                        </td>
                    </tr>
                `;
            }
        }
        async function loadPOIStats() {
            try {
                if (isVendor) {
                    const total = vendorAllPOIs.length;
                    const active = vendorAllPOIs.filter(p => p.isActive).length;
                    const inactive = total - active;
                    document.getElementById('totalPOIsStat').textContent = total;
                    document.getElementById('activePOIsStat').textContent = active;
                    document.getElementById('inactivePOIsStat').textContent = inactive;
                    return;
                }

                const stats = await api.getPOIStats();
                document.getElementById('totalPOIsStat').textContent = stats.totalPOIs ?? 0;
                document.getElementById('activePOIsStat').textContent = stats.activePOIs ?? 0;
                document.getElementById('inactivePOIsStat').textContent = stats.inactivePOIs ?? 0;
            } catch (error) {
                console.error('Error loading POI stats:', error);
            }
        }


        // Render table with data
        function renderTable(pois) {
            const tbody = document.getElementById('poiTableBody');
            
            if (!pois || pois.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 2rem; color: #999;">
                            Chưa có POI nào. <a href="poi-create" style="color: var(--primary);">Tạo POI đầu tiên</a>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = pois.map(poi => `
                <tr>
                    <td>
                        <input type="checkbox" class="checkbox poi-checkbox" data-id="${poi.poI_ID}" onchange="toggleSelect(${poi.poI_ID})">
                    </td>
                    <td>
                        <div class="poi-info">
                            <div class="poi-icon">
                                ${poi.imageUrl ? `<img src="${poi.imageUrl}" alt="${poi.name_Vi || 'POI'}">` : '📍'}
                            </div>
                            <div class="poi-details">
                                <h4 title="${poi.name_Vi || 'N/A'}">${poi.name_Vi || 'N/A'}</h4>
                            </div>
                        </div>
                    </td>
                    <td><span class="truncate" title="${poi.address || ''}">${poi.address || '-'}</span></td>
                    <td>${formatCategory(poi.category)}</td>
                    <td><span class="truncate" title="${formatOpeningHours(poi.openingHoursText, poi.openingHours)}">${formatOpeningHours(poi.openingHoursText, poi.openingHours)}</span></td>
                    <td>${poi.phoneNumber || '-'}</td>
                    <td><span class="truncate" title="${formatPriceRating(poi)}">${formatPriceRating(poi)}</span></td>
                    <td>
                        ${formatReviewBadge(poi)}
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-icon view" onclick="viewPOI(${poi.poI_ID})" title="Xem chi tiết">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn-icon edit" onclick="editPOI(${poi.poI_ID})" title="Chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon delete" onclick="deletePOI(${poi.poI_ID})" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Render pagination
        function renderPagination(totalPages, currentPageNum) {
            const pagination = document.querySelector('.pagination');
            let html = `
                <button class="pagination-btn" onclick="changePage('prev')" ${currentPageNum === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;

            // Show page numbers
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="pagination-btn ${i === currentPageNum ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (totalPages > 5) {
                html += `<span class="pagination-info">... ${totalPages}</span>`;
            }

            html += `
                <button class="pagination-btn" onclick="changePage('next')" ${currentPageNum === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;

            pagination.innerHTML = html;
        }

        // Pagination functions
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
                loadPOIs();
            } else if (direction === 'next') {
                currentPage++;
                loadPOIs();
            }
        }

        function goToPage(page) {
            currentPage = page;
            loadPOIs();
        }

        // Toggle select all
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.poi-checkbox');
            
            checkboxes.forEach(cb => {
                cb.checked = selectAll.checked;
                if (selectAll.checked) {
                    selectedPOIs.add(parseInt(cb.dataset.id));
                } else {
                    selectedPOIs.delete(parseInt(cb.dataset.id));
                }
            });
            
            updateBulkActions();
        }

        // Toggle individual select
        function toggleSelect(id) {
            if (selectedPOIs.has(id)) {
                selectedPOIs.delete(id);
            } else {
                selectedPOIs.add(id);
            }
            updateBulkActions();
        }

        // Update bulk actions visibility
        function updateBulkActions() {
            const bulkActions = document.getElementById('bulkActions');
            const selectedCount = document.getElementById('selectedCount');
            
            if (selectedPOIs.size > 0) {
                bulkActions.classList.add('active');
                selectedCount.textContent = selectedPOIs.size;
            } else {
                bulkActions.classList.remove('active');
            }
        }

        // Actions
        function viewPOI(id) {
            window.location.href = `poi-detail?id=${id}`;
        }

        function editPOI(id) {
            window.location.href = `poi-edit?id=${id}`;
        }

        async function deletePOI(id) {
            showConfirm('Bạn có chắc muốn xóa POI này?', async () => {
                try {
                    await api.deletePOI(id);
                    showAlert('Đã xóa POI thành công!');
                    loadPOIs();
                } catch (error) {
                    showAlert('Lỗi khi xóa POI: ' + error.message);
                }
            });
        }

        async function bulkDelete() {
            showConfirm(`Bạn có chắc muốn xóa ${selectedPOIs.size} POI đã chọn?`, async () => {
                try {
                    for (const id of selectedPOIs) {
                        await api.deletePOI(id);
                    }
                    showAlert(`Đã xóa ${selectedPOIs.size} POI thành công!`);
                    selectedPOIs.clear();
                    updateBulkActions();
                    loadPOIs();
                } catch (error) {
                    showAlert('Lỗi khi xóa POI: ' + error.message);
                }
            });
        }

        function ensureConfirmModal() {
            if (document.getElementById('appConfirmModal')) return;
            const overlay = document.createElement('div');
            overlay.id = 'appConfirmModal';
            overlay.className = 'app-confirm-overlay';
            overlay.innerHTML = `
                <div class="app-confirm" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle">
                    <div class="app-confirm-header" id="appConfirmTitle">Xác nhận</div>
                    <div class="app-confirm-body" id="appConfirmMessage"></div>
                    <div class="app-confirm-actions">
                        <button class="app-confirm-btn" id="appConfirmCancel">Hủy</button>
                        <button class="app-confirm-btn primary" id="appConfirmOk">Đồng ý</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showConfirm(message, onConfirm) {
            ensureConfirmModal();
            const overlay = document.getElementById('appConfirmModal');
            const msg = document.getElementById('appConfirmMessage');
            const okBtn = document.getElementById('appConfirmOk');
            const cancelBtn = document.getElementById('appConfirmCancel');
            msg.textContent = message || '';
            const close = () => overlay.classList.remove('active');
            const handleOk = () => { close(); onConfirm && onConfirm(); };
            const handleCancel = () => { close(); };
            okBtn.onclick = handleOk;
            cancelBtn.onclick = handleCancel;
            overlay.onclick = (e) => { if (e.target === overlay) handleCancel(); };
            overlay.classList.add('active');
        }

        function showAlert(message) {
            showConfirm(message, null);
            const okBtn = document.getElementById('appConfirmOk');
            const cancelBtn = document.getElementById('appConfirmCancel');
            if (cancelBtn) cancelBtn.style.display = 'none';
            if (okBtn) okBtn.textContent = 'OK';
        }

        function applyFilters() {
            currentSearch = document.getElementById('searchInput').value;
            const statusFilter = document.getElementById('statusFilter').value;
            currentCategory = document.getElementById('categoryFilter').value || null;
            currentSort = document.getElementById('sortFilter').value || 'newest';

            if (!statusFilter) {
                currentStatus = null;
            } else if (statusFilter === 'active') {
                currentStatus = true;
            } else if (statusFilter === 'inactive') {
                currentStatus = false;
            }

            currentPage = 1;
            loadPOIs();
        }

        function sortPois(list, sortKey) {
            const arr = (list || []).slice();
            switch (sortKey) {
                case 'oldest':
                    return arr.sort((a,b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                case 'name-asc':
                    return arr.sort((a,b) => String(a.name_Vi||a.name||'').localeCompare(String(b.name_Vi||b.name||''), 'vi'));
                case 'name-desc':
                    return arr.sort((a,b) => String(b.name_Vi||b.name||'').localeCompare(String(a.name_Vi||a.name||''), 'vi'));
                case 'views':
                    return arr.sort((a,b) => (b.viewCount||0) - (a.viewCount||0));
                case 'newest':
                default:
                    return arr.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }
        }

        function formatPriceRating(poi) {
            const rating = (poi.rating !== undefined && poi.rating !== null) ? `⭐ ${Number(poi.rating).toFixed(1)}` : '';
            return rating || '-';
        }

        function formatReviewBadge(poi) {
            const isActive = poi.isActive ?? poi.IsActive ?? true;
            return `
                <span class="status-badge ${isActive ? 'active' : 'inactive'}">
                    <span class="status-dot ${isActive ? 'active' : 'inactive'}"></span>
                    ${isActive ? 'Hoạt động' : 'Đã tắt'}
                </span>
            `;
        }

        function formatCategory(category) {
            if (!category) return '-';
            const key = String(category).trim().toLowerCase();
            const map = {
                // Vietnamese-coded values
                'oc': 'Ốc',
                'pho': 'Phở',
                'bun': 'Bún',
                'banh-mi': 'Bánh mì',
                'com': 'Cơm',
                'com-tam': 'Cơm tấm',
                'lau': 'Lẩu',
                'hotpot': 'Lẩu',
                'nuong': 'Nướng',
                'hai-san': 'Hải sản',
                'seafood': 'Hải sản',
                'do-uong': 'Đồ uống',
                'trang-mieng': 'Tráng miệng',
                'snack': 'Đồ ăn vặt',
                'breakfast': 'Ăn sáng',
                'che': 'Chè',
                'khac': 'Khác',
                'other': 'Khác',

                // English categories from seed data
                'street entrance': 'Cổng vào phố ẩm thực',
                'snails restaurant': 'Quán ốc',
                'hot pot restaurant': 'Quán lẩu',
                'bbq & hot pot': 'Nướng & lẩu',
                'vietnamese traditional food': 'Ẩm thực truyền thống Việt',
                'vietnamese beef steak': 'Bò né',
                'late night dining': 'Ăn khuya',
                'late night seafood': 'Hải sản đêm',
                'vietnamese rice & noodles': 'Cơm & bún Việt',
                'vietnamese-chinese bbq': 'Nướng Trung - Việt'
            };
            return map[key] || (/[^\x00-\x7F]/.test(category) ? category : 'Khác');
        }

        function updateCategoryFilter(pois) {
            const select = document.getElementById('categoryFilter');
            if (!select) return;
            const set = new Set(categoryCache);
            (pois || []).forEach(p => {
                const raw = p.category || '';
                if (raw) set.add(raw);
            });
            const list = Array.from(set).filter(Boolean);
            list.sort((a,b) => formatCategory(a).localeCompare(formatCategory(b), 'vi'));
            categoryCache = list;

            const current = select.value || '';
            select.innerHTML = '<option value="">Tất cả</option>' + list.map(c => {
                const label = formatCategory(c);
                return `<option value="${String(c).replace(/"/g,'&quot;')}">${label}</option>`;
            }).join('');
            select.value = current;
        }

        function formatOpeningHours(openingHoursText, openingHoursList) {
            const parts = (() => {
                const text = (openingHoursText || '').trim();
                if (text) return text.split(';').map(p => p.trim()).filter(Boolean);
                if (Array.isArray(openingHoursList) && openingHoursList.length) return openingHoursList;
                return [];
            })();

            if (!parts.length) return '-';

            const entries = parts.map(p => {
                const cleaned = p.replace(/^Thứ\s*(\d+)\s*:\s*/i, (m, d) => `T${d}: `)
                    .replace(/^Chủ\s*nhật\s*:\s*/i, 'CN: ')
                    .replace(/^CN\s*:\s*/i, 'CN: ');
                const [day, time] = cleaned.split(':').map(s => s.trim());
                return { day, time: time || '' };
            }).filter(e => e.day && e.time);

            const getTime = (day) => entries.find(e => e.day === day)?.time || '';
            const t2 = getTime('T2');
            const t3 = getTime('T3');
            const t4 = getTime('T4');
            const t5 = getTime('T5');
            const t6 = getTime('T6');
            const t7 = getTime('T7');
            const cn = getTime('CN');

            const weekdays = [t2, t3, t4, t5, t6, t7].filter(Boolean);
            const allWeekdaysSame = weekdays.length === 6 && weekdays.every(t => t === weekdays[0]);

            if (allWeekdaysSame) {
                if (cn && cn === weekdays[0]) {
                    return `T2–CN: ${weekdays[0]}`;
                }
                if (cn) {
                    return `T2–T7: ${weekdays[0]}; CN: ${cn}`;
                }
                return `T2–T7: ${weekdays[0]}`;
            }

            return parts.join('; ');
        }

        // Initialize - Load POIs on page load
        loadPOIs();

        // Search on Enter key
        document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });
    </script>

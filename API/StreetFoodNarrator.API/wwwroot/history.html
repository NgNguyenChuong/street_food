<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngu?i d�ng & L?ch s? - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js?v=20260406"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%); color: var(--dark); overflow-x: hidden; }
        .main-content { margin-left: 0; padding: 2rem; min-height: 100vh; transition: margin-left 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; animation: fadeIn 0.6s ease-out; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.75rem; border-radius: 20px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s; position: relative; overflow: hidden; animation: fadeInUp 0.6s ease-out backwards; }
        .stat-card:nth-child(1) { animation-delay: 0.1s; } .stat-card:nth-child(2) { animation-delay: 0.2s; } .stat-card:nth-child(3) { animation-delay: 0.3s; } .stat-card:nth-child(4) { animation-delay: 0.4s; } .stat-card:nth-child(5) { animation-delay: 0.5s; } .stat-card:nth-child(6) { animation-delay: 0.6s; }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--gradient); opacity: 0.04; border-radius: 0 20px 0 100%; }
        .stat-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px var(--shadow); }
        .stat-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; }
        .stat-icon.primary { background: rgba(255,107,53,0.12); color: var(--primary); }
        .stat-icon.success { background: rgba(6,214,160,0.12); color: var(--success); }
        .stat-icon.secondary { background: rgba(0,78,137,0.12); color: var(--secondary); }
        .stat-icon.accent { background: rgba(255,210,63,0.12); color: #D69E00; }
        .stat-icon.danger { background: rgba(239,71,111,0.12); color: var(--danger); }
        .stat-value { font-size: 2.25rem; font-weight: 700; color: var(--dark); margin-bottom: 0.35rem; }
        .stat-label { color: #666; font-size: 0.9rem; }

        .section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--dark); margin: 2.5rem 0 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
        .section-title i { color: var(--primary); }

        .card { background: white; border-radius: 20px; padding: 1.75rem; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 1.5rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); }
        .card-title { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999; }
        .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.3s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        .filter-select { padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; outline: none; transition: 0.3s; background: white; min-width: 150px; cursor: pointer; }
        .filter-select:focus { border-color: var(--primary); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead { background: linear-gradient(to right, #F8F9FA, #F0F4F8); }
        th { padding: 1rem 1.25rem; text-align: left; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); color: #666; }
        td { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); color: #444; font-size: 0.95rem; vertical-align: middle; }
        tr { transition: background-color 0.2s; }
        tr:hover td { background: rgba(255,107,53,0.02); }

        .badge { padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.muted { background: rgba(0,0,0,0.05); color: #666; }
        .badge.success { background: rgba(6,214,160,0.12); color: var(--success); }
        .badge.ios { background: rgba(0,78,137,0.1); color: var(--secondary); border: 1px solid rgba(0,78,137,0.2); }
        .badge.android { background: rgba(6,214,160,0.1); color: var(--success); border: 1px solid rgba(6,214,160,0.2); }
        .time-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #666; background: rgba(0,0,0,0.03); padding: 0.25rem 0.5rem; border-radius: 4px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 2rem; }
        .pagination-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); background: white; color: var(--dark); font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .pagination-btn:hover { border-color: var(--primary); color: var(--primary); }
        .pagination-btn.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border-color: transparent; }
        .pagination-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: #666; margin: 0 1rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .main-content { margin-left: 0; } table { display: block; overflow-x: auto; } }
    </style>
</head>
<body>
<main class="main-content" id="mainContent">
    <header class="header">
        <h1 class="page-title">Ngu?i d�ng & L?ch s?</h1>
    </header>

    <!-- ===== OVERVIEW STATS ===== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-walking"></i></div>
            <div class="stat-value" id="stat-narrations">&#8212;</div>
            <div class="stat-label">T?ng Narrations</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success"><i class="fas fa-volume-up"></i></div>
            <div class="stat-value" id="stat-audio">&#8212;</div>
            <div class="stat-label">Audio du?c ph�t</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon secondary"><i class="fas fa-mobile-alt"></i></div>
            <div class="stat-value" id="stat-devices">&#8212;</div>
            <div class="stat-label">T?ng thi?t b?</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon accent"><i class="fas fa-chart-line"></i></div>
            <div class="stat-value" id="stat-active7d">&#8212;</div>
            <div class="stat-label">Thi?t b? H� 7 ng�y</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon secondary"><i class="fab fa-apple"></i></div>
            <div class="stat-value" id="stat-ios">&#8212;</div>
            <div class="stat-label">Thi?t b? iOS</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success"><i class="fab fa-android"></i></div>
            <div class="stat-value" id="stat-android">&#8212;</div>
            <div class="stat-label">Thi?t b? Android</div>
        </div>
    </div>

    <!-- ===== TOP POIs ===== -->
    <h2 class="section-title"><i class="fas fa-fire"></i> POI ph? bi?n nh?t</h2>
    <div class="card">
        <div id="top-pois">
            <div style="text-align:center;padding:2rem;color:#999"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
    </div>

    <!-- ===== DEVICE TABLE ===== -->
    <h2 class="section-title"><i class="fas fa-mobile-alt"></i> Danh s�ch thi?t b?</h2>
    <div class="card">
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="devSearchInput" placeholder="T�m ki?m theo Device ID, Model..." oninput="filterDevices()">
            </div>
            <select id="osFilter" class="filter-select" onchange="filterDevices()">
                <option value="">T?t c? H? di?u h�nh</option>
                <option value="iOS">iOS</option>
                <option value="Android">Android</option>
            </select>
        </div>

        <table id="devTable">
            <thead>
                <tr>
                    <th>H? di?u h�nh</th>
                    <th>Model</th>
                    <th>Phi�n b?n OS</th>
                    <th>Phi�n b?n App</th>
                    <th>Sessions</th>
                    <th>L?n dang nh?p cu?i</th>
                </tr>
            </thead>
            <tbody id="devBody">
                <tr><td colspan="6" style="text-align:center;padding:3rem;color:#999"><i class="fas fa-spinner fa-spin"></i> �ang t?i...</td></tr>
            </tbody>
        </table>
        <div class="pagination" id="devPagination"></div>
    </div>
</main>

<script src="api.js"></script>
<script>
    if (!TokenManager.isAuthenticated() && !localStorage.getItem('userSession')) {
        window.location.href = 'index';
    }

    let allDevices = [];
    let filteredDevices = [];
    let devPage = 1;
    const DEV_PAGE_SIZE = 5;

    /* ====== LOAD ALL DATA ====== */
    async function loadAll() {
        try {
            const [overview, topPois, devRes] = await Promise.all([
                AnalyticsApi.overview(),
                AnalyticsApi.topPOIs(5),
                AnalyticsApi.devices({ page: 1, pageSize: 500 })
            ]);

            // Overview stats
            document.getElementById('stat-narrations').textContent = overview.totalNarrations || 0;
            document.getElementById('stat-audio').textContent = overview.totalAudioPlayed || 0;
            document.getElementById('stat-devices').textContent = overview.totalDevices || 0;
            document.getElementById('stat-active7d').textContent = overview.activeDevicesLast7Days || 0;

            // Device stats
            allDevices = devRes.data || [];
            filteredDevices = allDevices.slice();
            document.getElementById('stat-ios').textContent = allDevices.filter(d => d.platform === 'iOS').length;
            document.getElementById('stat-android').textContent = allDevices.filter(d => d.platform === 'Android').length;

            // Render sections
            renderTopPois(topPois || []);
            renderDevTable(filteredDevices);
        } catch(err) {
            console.error(err);
            document.getElementById('devBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> L?i khi t?i d? li?u</td></tr>';
        }
    }

    function renderTopPois(pois) {
        const container = document.getElementById('top-pois');
        if (!pois.length) { container.innerHTML = '<div style="color:#999;font-style:italic">Chua c� d? li?u</div>'; return; }
        container.innerHTML = '<ul style="list-style:none;padding:0;margin:0">' + pois.map(function(p, i) {
            return '<li style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0;border-bottom:1px solid var(--border)">' +
                '<div style="display:flex;align-items:center;gap:1rem">' +
                    '<div style="width:28px;height:28px;border-radius:50%;background:var(--gradient);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.85rem">' + (i+1) + '</div>' +
                    '<span style="font-weight:600;color:var(--dark)">' + (p.poiName || '\u2014') + '</span>' +
                '</div>' +
                '<div style="font-weight:bold;color:var(--primary)">' + (p.viewCount || 0) + ' lu?t</div>' +
            '</li>';
        }).join('') + '</ul>';
    }

    /* ====== DEVICE RENDERERS ====== */
    function timeSince(dateStr) {
        if (!dateStr) return '\u2014';
        var seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
        if(seconds < 60) return seconds + 's tru?c';
        var minutes = Math.floor(seconds / 60);
        if(minutes < 60) return minutes + ' ph�t tru?c';
        var hours = Math.floor(minutes / 60);
        if(hours < 24) return hours + ' gi? tru?c';
        var days = Math.floor(hours / 24);
        return days + ' ng�y tru?c';
    }

    function renderDevTable(data) {
        var tbody = document.getElementById('devBody');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#999">Kh�ng t�m th?y thi?t b? n�o.</td></tr>';
            renderDevPagination(1);
            return;
        }
        var totalPages = Math.max(1, Math.ceil(data.length / DEV_PAGE_SIZE));
        devPage = Math.min(devPage, totalPages);
        var start = (devPage - 1) * DEV_PAGE_SIZE;
        var pageItems = data.slice(start, start + DEV_PAGE_SIZE);
        tbody.innerHTML = pageItems.map(function(d) {
            var badgeClass = d.platform === 'iOS' ? 'ios' : 'android';
            return '<tr onclick="showDeviceDetails(\'' + d.id + '\')" style="cursor:pointer">' +
                '<td><span class="badge ' + badgeClass + '"><i class="fab fa-' + d.platform.toLowerCase() + '" style="margin-right:4px"></i>' + d.platform + '</span></td>' +
                '<td style="font-weight:600;color:var(--dark)">' + (d.model || 'Unknown Model') + '</td>' +
                '<td style="color:#666">' + (d.osVersion || '\u2014') + '</td>' +
                '<td style="color:#666">' + (d.appVersion || '\u2014') + '</td>' +
                '<td><span style="font-weight:600;color:var(--primary);padding:0.25rem 0.75rem;background:rgba(255,107,53,0.1);border-radius:12px">' + d.totalSessions + '</span></td>' +
                '<td>' +
                    '<div style="display:flex;flex-direction:column;gap:0.25rem">' +
                        '<span style="font-size:0.85rem;color:var(--dark)">' + new Date(d.lastSeen).toLocaleDateString('vi-VN') + ' ' + new Date(d.lastSeen).toLocaleTimeString('vi-VN') + '</span>' +
                        '<span class="time-badge" style="width:fit-content">' + timeSince(d.lastSeen) + '</span>' +
                    '</div>' +
                '</td>' +
            '</tr>';
        }).join('');
        renderDevPagination(totalPages);
    }

    function renderDevPagination(totalPages) {
        var wrap = document.getElementById('devPagination');
        if (!wrap) return;
        if (totalPages <= 1) { wrap.innerHTML = ''; return; }
        var html = '';
        html += '<button class="pagination-btn" ' + (devPage === 1 ? 'disabled' : '') + ' onclick="changeDevPage(\'prev\')"><i class="fas fa-chevron-left"></i></button>';
        for (var i = 1; i <= Math.min(totalPages, 5); i++) {
            html += '<button class="pagination-btn ' + (i === devPage ? 'active' : '') + '" onclick="goToDevPage(' + i + ')">' + i + '</button>';
        }
        if (totalPages > 5) {
            html += '<span class="pagination-info">... ' + totalPages + '</span>';
        }
        html += '<button class="pagination-btn" ' + (devPage === totalPages ? 'disabled' : '') + ' onclick="changeDevPage(\'next\')"><i class="fas fa-chevron-right"></i></button>';
        wrap.innerHTML = html;
    }

    function changeDevPage(direction) {
        if (direction === 'prev' && devPage > 1) {
            devPage--;
        } else if (direction === 'next') {
            devPage++;
        }
        renderDevTable(filteredDevices);
    }

    function goToDevPage(page) {
        devPage = page;
        renderDevTable(filteredDevices);
    }

    function setDevPage(page) {
        goToDevPage(page);
    }

    function filterDevices() {
        var s = document.getElementById('devSearchInput').value.toLowerCase();
        var os = document.getElementById('osFilter').value;
        var filtered = allDevices;
        if (s) {
            filtered = filtered.filter(function(d) {
                return (d.deviceId && d.deviceId.toLowerCase().includes(s)) ||
                       (d.model && d.model.toLowerCase().includes(s));
            });
        }
        if (os) {
            filtered = filtered.filter(function(d) { return d.platform === os; });
        }
        filteredDevices = filtered.slice();
        devPage = 1;
        renderDevTable(filteredDevices);
    }

    function showToast(message, type, timeout) {
        if (window.UiFeedback && window.UiFeedback.toast) {
            window.UiFeedback.toast(message, type || 'info', timeout || 4200);
            return;
        }
        if (!message) return;
        var kind = type || 'info';
        var delay = timeout || 4200;
        var wrap = document.getElementById('toastWrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'toastWrap';
            wrap.style.position = 'fixed';
            wrap.style.top = '1rem';
            wrap.style.right = '1rem';
            wrap.style.zIndex = '12000';
            wrap.style.display = 'flex';
            wrap.style.flexDirection = 'column';
            wrap.style.gap = '.5rem';
            document.body.appendChild(wrap);
        }
        var item = document.createElement('div');
        item.style.background = kind === 'error' ? '#b42318' : '#1f2937';
        item.style.color = '#fff';
        item.style.padding = '.8rem 1rem';
        item.style.borderRadius = '10px';
        item.style.fontWeight = '600';
        item.style.maxWidth = '540px';
        item.style.whiteSpace = 'pre-line';
        item.style.boxShadow = '0 10px 26px rgba(0,0,0,.18)';
        item.textContent = String(message);
        wrap.appendChild(item);
        setTimeout(function() { item.remove(); }, delay);
    }

    function showDeviceDetails(id) {
        var device = allDevices.find(function(d) { return d.id === id; });
        if(!device) return;
        showToast('Device ID: ' + device.deviceId + '\nPlatform: ' + device.platform + '\nModel: ' + device.model + '\nOS Version: ' + device.osVersion + '\nApp Version: ' + device.appVersion + '\nTotal Sessions: ' + device.totalSessions + '\nPOIs Viewed: ' + device.totalPOIsViewed + '\nAudio Played: ' + device.totalAudioPlayed + '\nFirst Seen: ' + new Date(device.firstSeen).toLocaleString('vi-VN') + '\nLast Seen: ' + new Date(device.lastSeen).toLocaleString('vi-VN'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        // Admin-only page
        var role = (sessionStorage.getItem('activeRole') || localStorage.getItem('activeRole') || '').toLowerCase();
        if (role !== 'admin') {
            window.location.href = 'dashboard';
            return;
        }
        loadAll();
    });


    function setDevPageass(page) {
        devPage = page;
        renderDevTable(filteredDevices);
    }
</script>
</body>
</html>

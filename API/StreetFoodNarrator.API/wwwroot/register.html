<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .register-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }
        
        .error {
            background: rgba(239, 71, 111, 0.1);
            color: #EF476F;
            padding: 0.875rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .success {
            background: rgba(6, 214, 160, 0.1);
            color: #06D6A0;
            padding: 0.875rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        
        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🍜 Đăng Ký Tài Khoản</h1>
        </div>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Họ và Tên *</label>
                <input type="text" id="fullName" required placeholder="Nguyễn Văn A">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>
            
            <div class="form-group">
                <label for="phoneNumber">Số Điện Thoại</label>
                <input type="tel" id="phoneNumber" placeholder="0912345678 hoặc +84912345678">
            </div>
            
            <div class="form-group">
                <label for="password">Mật Khẩu *</label>
                <input type="password" id="password" required minlength="8" placeholder="Ví dụ: StreetFoodA">
                <small style="color: #666; font-size: 0.85rem;">Tối thiểu 8 ký tự và có ít nhất 1 chữ in HOA</small>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Xác Nhận Mật Khẩu *</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>
            
            <button type="submit" class="btn">Đăng Ký</button>
        </form>
        
        <div class="login-link">
            Đã có tài khoản? <a href="/">Đăng nhập</a>
        </div>
    </div>
    
    <script src="api.js"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i;
        const PHONE_REGEX = /^\+84(3|5|7|8|9)\d{8}$/;
        const PASSWORD_REGEX = /^(?=.*[A-Z]).{8,}$/;
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const rawPhone = document.getElementById('phoneNumber').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let phoneNumber = null;
            if (rawPhone) {
                let normalizedPhone = rawPhone.replace(/[\s.\-]/g, '');
                if (normalizedPhone.startsWith('84')) {
                    normalizedPhone = `+${normalizedPhone}`;
                } else if (normalizedPhone.startsWith('0')) {
                    normalizedPhone = `+84${normalizedPhone.slice(1)}`;
                }

                if (!PHONE_REGEX.test(normalizedPhone)) {
                    errorDiv.textContent = 'Số điện thoại không đúng định dạng Việt Nam.';
                    errorDiv.style.display = 'block';
                    return;
                }

                phoneNumber = normalizedPhone;
            }
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (fullName.length < 2) {
                errorDiv.textContent = 'Họ và tên phải có ít nhất 2 ký tự.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!EMAIL_REGEX.test(email)) {
                errorDiv.textContent = 'Email không đúng định dạng.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Validate passwords
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Mật khẩu xác nhận không khớp!';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!PASSWORD_REGEX.test(password)) {
                errorDiv.textContent = 'Mật khẩu phải có ít nhất 8 ký tự và chứa tối thiểu 1 chữ in HOA.';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await api.register(email, password, fullName, phoneNumber);
                
                successDiv.textContent = 'Đăng ký thành công! Chuyển hướng đến trang đăng nhập...';
                successDiv.style.display = 'block';
                registerForm.reset();
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                console.error('Registration error:', error);
                errorDiv.textContent = error.message || 'Đăng ký thất bại. Vui lòng thử lại.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết bị - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%); color: var(--dark); overflow-x: hidden; }
        .main-content { margin-left: 280px; padding: 2rem; min-height: 100vh; transition: margin-left 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; animation: fadeIn 0.6s ease-out; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; }
        .btn-primary { background: var(--gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.3); }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .stat-card { background: white; padding: 1.75rem; border-radius: 20px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s; position: relative; overflow: hidden; animation: fadeInUp 0.6s ease-out backwards; }
        .stat-card:nth-child(1) { animation-delay: 0.1s; } .stat-card:nth-child(2) { animation-delay: 0.2s; } .stat-card:nth-child(3) { animation-delay: 0.3s; } .stat-card:nth-child(4) { animation-delay: 0.4s; }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--gradient); opacity: 0.04; border-radius: 0 20px 0 100%; }
        .stat-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px var(--shadow); }
        .stat-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; }
        .stat-icon.primary { background: rgba(255,107,53,0.12); color: var(--primary); }
        .stat-icon.success { background: rgba(6,214,160,0.12); color: var(--success); }
        .stat-icon.secondary { background: rgba(0,78,137,0.12); color: var(--secondary); }
        .stat-icon.danger { background: rgba(239,71,111,0.12); color: var(--danger); }
        .stat-value { font-size: 2.25rem; font-weight: 700; color: var(--dark); margin-bottom: 0.35rem; }
        .stat-label { color: #666; font-size: 0.9rem; }

        .card { background: white; border-radius: 20px; padding: 1.75rem; box-shadow: 0 4px 20px var(--shadow); animation: fadeInUp 0.6s ease-out 0.4s backwards; margin-bottom: 2rem; }
        
        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999; }
        .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.3s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        .filter-select { padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; outline: none; transition: 0.3s; background: white; min-width: 150px; cursor: pointer; }
        .filter-select:focus { border-color: var(--primary); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead { background: linear-gradient(to right, #F8F9FA, #F0F4F8); }
        th { padding: 1rem 1.25rem; text-align: left; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); color: #666; }
        td { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); color: #444; font-size: 0.95rem; vertical-align: middle; }
        tr { transition: background-color 0.2s; cursor: pointer; }
        tr:hover td { background: rgba(255,107,53,0.02); }
        
        .badge { padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.ios { background: rgba(0,78,137,0.1); color: var(--secondary); border: 1px solid rgba(0,78,137,0.2); }
        .badge.android { background: rgba(6,214,160,0.1); color: var(--success); border: 1px solid rgba(6,214,160,0.2); }

        .time-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #666; background: rgba(0,0,0,0.03); padding: 0.25rem 0.5rem; border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .main-content { margin-left: 0; } table { display: block; overflow-x: auto; } }
    </style>
</head>
<body>
<main class="main-content" id="mainContent">
    <header class="header">
        <h1 class="page-title">Thiết bị người dùng</h1>
        <div class="header-actions">
            <!--<button class="btn btn-outline"><i class="fas fa-download"></i> Xuất CSV</button>-->
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-mobile-alt"></i></div>
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label">Tổng thiết bị</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon secondary"><i class="fab fa-apple"></i></div>
            <div class="stat-value" id="stat-ios">—</div>
            <div class="stat-label">Thiết bị iOS</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success"><i class="fab fa-android"></i></div>
            <div class="stat-value" id="stat-android">—</div>
            <div class="stat-label">Thiết bị Android</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon danger"><i class="fas fa-ban"></i></div>
            <div class="stat-value" id="stat-blocked">0</div>
            <div class="stat-label">Đã chặn</div>
        </div>
    </div>

    <!-- Content -->
    <div class="card">
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo Device ID..." oninput="filterData()">
            </div>
            <select id="osFilter" class="filter-select" onchange="filterData()">
                <option value="">Tất cả Hệ điều hành</option>
                <option value="iOS">iOS</option>
                <option value="Android">Android</option>
            </select>
        </div>

        <table id="devTable">
            <thead>
                <tr>
                    <th>Hệ điều hành</th>
                    <th>Model</th>
                    <th>Phiên bản OS</th>
                    <th>Phiên bản App</th>
                    <th>Sessions</th>
                    <th>Lần đăng nhập cuối</th>
                </tr>
            </thead>
            <tbody id="devBody">
                <tr><td colspan="6" style="text-align:center;padding:3rem;color:#999"><i class="fas fa-spinner fa-spin"></i> Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="api.js"></script>
<script>
    if (!TokenManager.isAuthenticated() && !localStorage.getItem('userSession')) {
        window.location.href = 'index.html';
    }

    let allDevices = [];

    async function loadData() {
        try {
            document.getElementById('devBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#999"><i class="fas fa-spinner fa-spin fa-2x"></i></td></tr>';
            
            const res = await AnalyticsApi.devices({ page: 1, pageSize: 500 });
            allDevices = res.data || [];
            
            document.getElementById('stat-total').textContent = res.total || allDevices.length;
            document.getElementById('stat-ios').textContent = allDevices.filter(d => d.platform === 'iOS').length;
            document.getElementById('stat-android').textContent = allDevices.filter(d => d.platform === 'Android').length;

            renderTable(allDevices);
        } catch(err) {
            console.error(err);
            document.getElementById('devBody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> Lỗi khi tải dữ liệu</td></tr>`;
        }
    }

    function timeSince(dateStr) {
        if (!dateStr) return '—';
        const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
        if(seconds < 60) return seconds + 's trước';
        const minutes = Math.floor(seconds / 60);
        if(minutes < 60) return minutes + ' phút trước';
        const hours = Math.floor(minutes / 60);
        if(hours < 24) return hours + ' giờ trước';
        const days = Math.floor(hours / 24);
        return days + ' ngày trước';
    }

    function renderTable(data) {
        const tbody = document.getElementById('devBody');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#999">Không tìm thấy thiết bị nào.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(d => {
            const badgeClass = d.platform === 'iOS' ? 'ios' : 'android';
            
            return `
            <tr onclick="showDetails('${d.id}')">
                <td><span class="badge ${badgeClass}"><i class="fab fa-${d.platform.toLowerCase()}" style="margin-right:4px"></i>${d.platform}</span></td>
                <td style="font-weight:600;color:var(--dark)">${d.model || 'Unknown Model'}</td>
                <td style="color:#666">${d.osVersion || '—'}</td>
                <td style="color:#666">${d.appVersion || '—'}</td>
                <td><span style="font-weight:600;color:var(--primary);padding:0.25rem 0.75rem;background:rgba(255,107,53,0.1);border-radius:12px">${d.totalSessions}</span></td>
                <td>
                    <div style="display:flex;flex-direction:column;gap:0.25rem">
                        <span style="font-size:0.85rem;color:var(--dark)">${new Date(d.lastSeen).toLocaleDateString('vi-VN')} ${new Date(d.lastSeen).toLocaleTimeString('vi-VN')}</span>
                        <span class="time-badge" style="width:fit-content">${timeSince(d.lastSeen)}</span>
                    </div>
                </td>
            </tr>
            `;
        }).join('');
    }

    function filterData() {
        const s = document.getElementById('searchInput').value.toLowerCase();
        const os = document.getElementById('osFilter').value;

        let filtered = allDevices;
        if (s) {
            filtered = filtered.filter(d => 
                (d.deviceId && d.deviceId.toLowerCase().includes(s)) ||
                (d.model && d.model.toLowerCase().includes(s))
            );
        }
        if (os) {
            filtered = filtered.filter(d => d.platform === os);
        }

        renderTable(filtered);
    }

    function showDetails(id) {
        const device = allDevices.find(d => d.id === id);
        if(!device) return;
        
        alert(`Device ID: ${device.deviceId}\nPlatform: ${device.platform}\nModel: ${device.model}\nOS Version: ${device.osVersion}\nApp Version: ${device.appVersion}\nTotal Sessions: ${device.totalSessions}\nPOIs Viewed: ${device.totalPOIsViewed}\nAudio Played: ${device.totalAudioPlayed}\nFirst Seen: ${new Date(device.firstSeen).toLocaleString('vi-VN')}\nLast Seen: ${new Date(device.lastSeen).toLocaleString('vi-VN')}`);
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>

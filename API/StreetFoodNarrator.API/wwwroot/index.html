<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Street Food Narrator CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            width: 100%;
            max-width: 460px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 72px; height: 72px;
            background: var(--gradient);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 24px rgba(255,107,53,0.35);
        }
        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p { color: #888; font-size: 0.9rem; margin-top: 0.35rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--dark); font-weight: 600; font-size: 0.9rem; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 0.875rem 1rem 0.875rem 2.8rem;
            border: 2px solid #E8ECF1;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
            background: #F8F9FA;
        }
        input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa; }
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'DM Sans', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,107,53,0.35); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .error-box {
            background: rgba(239,71,111,0.1);
            color: var(--danger);
            padding: 0.875rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        .links { text-align: center; margin-top: 1.5rem; color: #888; font-size: 0.875rem; }
        .links a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🍜</div>
            <h1>Street Food Narrator</h1>
            <p>Content Management System</p>
        </div>
        <div id="errorBox" class="error-box">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMsg">Email hoặc mật khẩu không đúng</span>
        </div>
        <div class="form-group">
            <label for="loginEmail"><i class="fas fa-envelope" style="color:var(--primary);margin-right:6px"></i>Email</label>
            <div class="input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="admin@streetfood.vn">
            </div>
        </div>
        <div class="form-group">
            <label for="loginPw"><i class="fas fa-lock" style="color:var(--primary);margin-right:6px"></i>Mật khẩu</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPw" placeholder="••••••••">
            </div>
        </div>
        <button class="btn" id="loginBtn" onclick="doLogin()">
            <i class="fas fa-sign-in-alt"></i>
            Đăng nhập
        </button>
        <div class="links">
            Chưa có tài khoản? <a href="register">Đăng ký</a>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Auto-fill if stored
        document.getElementById('loginEmail').value = localStorage.getItem('last_email') || '';

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pw = document.getElementById('loginPw').value;
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('errorBox');
            const errMsg = document.getElementById('errorMsg');

            errBox.style.display = 'none';
            if (!email || !pw) {
                errMsg.textContent = 'Vui lòng nhập email và mật khẩu';
                errBox.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';

            try {
                const data = await api.login(email, pw);
                if (data && data.token) {
                    localStorage.setItem('last_email', email);
                    console.log('Login success, redirecting to: dashboard');
                    // Force clean redirect without .html extension
                    window.location.replace('/dashboard');
                } else {
                    errMsg.textContent = 'Đăng nhập thất bại, vui lòng thử lại';
                    errBox.style.display = 'flex';
                }
            } catch (err) {
                errMsg.textContent = err.message || 'Email hoặc mật khẩu không đúng';
                errBox.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập';
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>

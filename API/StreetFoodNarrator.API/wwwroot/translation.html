<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản dịch - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js?v=20260406"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%); color: var(--dark); overflow-x: hidden; }
        .main-content { margin-left: 0; padding: 2rem; min-height: 100vh; transition: margin-left 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; animation: fadeIn 0.6s ease-out; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; }
        .btn-primary { background: var(--gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.3); }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; animation: fadeInUp 0.6s ease-out 0.2s backwards; }
        .stat-card { background: white; padding: 1.75rem; border-radius: 20px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--gradient); opacity: 0.04; border-radius: 0 20px 0 100%; }
        .stat-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; }
        .stat-icon.primary { background: rgba(255,107,53,0.12); color: var(--primary); }
        .stat-icon.success { background: rgba(6,214,160,0.12); color: var(--success); }
        .stat-icon.accent { background: rgba(255,210,63,0.12); color: #D69E00; }
        .stat-value { font-size: 2.25rem; font-weight: 700; color: var(--dark); margin-bottom: 0.35rem; }
        .stat-label { color: #666; font-size: 0.9rem; }

        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; animation: fadeIn 0.6s ease-out 0.4s backwards; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999; }
        .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.3s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        
        .table-container { background: white; border-radius: 20px; box-shadow: 0 4px 20px var(--shadow); overflow: hidden; animation: fadeInUp 0.6s ease-out 0.5s backwards; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background: var(--light); border-bottom: 2px solid var(--border); }
        th { padding: 1.25rem 1.5rem; font-weight: 700; color: var(--dark); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tbody tr { transition: background 0.2s; }
        tbody tr:hover { background: #fdfdfd; }
        
        .badge { display: inline-flex; align-items: center; padding: 0.35rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.cat { background: rgba(0,78,137,0.1); color: var(--secondary); }
        .status-badge { display: inline-flex; align-items: center; padding: 0.35rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-badge.done { background: rgba(6,214,160,0.15); color: var(--success); }
        .status-badge.review { background: rgba(255,210,63,0.15); color: #D69E00; }
        .status-badge.draft { background: rgba(26,26,46,0.1); color: #666; }

        .actions { display: flex; gap: 0.5rem; }
        .btn-icon { width: 36px; height: 36px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; background: white; border: 1px solid var(--border); color: #666; }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); background: rgba(255,107,53,0.05); }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 2rem; }
        .pagination-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); background: white; color: var(--dark); font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .pagination-btn:hover { border-color: var(--primary); color: var(--primary); }
        .pagination-btn.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border-color: transparent; }
        .pagination-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: #666; margin: 0 1rem; }

        /* Modal styling */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,26,46,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.3s; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; width: 90%; max-width: 800px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeInUp 0.4s ease-out; overflow: hidden; }
        .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .modal-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--dark); }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: #999; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 2rem; max-height: calc(100vh - 200px); overflow-y: auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--dark); }
        .form-control { width: 100%; padding: 0.875rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        .modal-footer { padding: 1.5rem 2rem; background: var(--light); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .main-content { margin-left: 0; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main class="main-content" id="mainContent">
    <header class="header">
        <h1 class="page-title">Bản dịch Địa điểm (POI)</h1>
        <div class="header-actions">
            <!-- Hidden create button, translations are usually edits of existing POIs -->
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-language"></i></div>
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label">Tổng số POI (Cần dịch)</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
            <div class="stat-value" id="stat-done">—</div>
            <div class="stat-label">Đã dịch Tiếng Anh</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon accent"><i class="fas fa-star-half-alt"></i></div>
            <div class="stat-value" id="stat-zh">—</div>
            <div class="stat-label">Đã dịch Tiếng Trung</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm POI..." oninput="filterData()">
        </div>
    </div>

    <!-- Content -->
    <div class="table-container">
        <table id="transTable">
            <thead>
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 25%">Tên (Vi)</th>
                    <th style="width: 25%">Tên (En)</th>
                    <th style="width: 25%">Tên (Zh)</th>
                    <th style="width: 10%">Thao tác</th>
                </tr>
            </thead>
            <tbody id="transBody">
                <tr><td colspan="5" style="text-align:center;padding:3rem;color:#999"><i class="fas fa-spinner fa-spin fa-2x"></i></td></tr>
            </tbody>
        </table>
        <div class="pagination" id="transPagination"></div>
    </div>
</main>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="transModal">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Chỉnh sửa bản dịch</h2>
            <button class="modal-close" onclick="closeModal('transModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="poiId">
            <div class="form-group">
                <label class="form-label" style="color: var(--primary)">Tên gốc (Tiếng Việt) / Mô tả</label>
                <input type="text" id="poiNameVi" class="form-control" style="background: #f5f5f5; margin-bottom: 0.5rem" readonly>
                <textarea id="poiDescVi" class="form-control" rows="3" style="background: #f5f5f5;" readonly></textarea>
            </div>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 2rem 0;">

            <div class="form-group">
                <label class="form-label">Tên (English)</label>
                <input type="text" id="poiNameEn" class="form-control" placeholder="English name">
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả (English)</label>
                <textarea id="poiDescEn" class="form-control" rows="3" placeholder="English description"></textarea>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 2rem 0;">

            <div class="form-group">
                <label class="form-label">Tên (Chinese)</label>
                <input type="text" id="poiNameZh" class="form-control" placeholder="Chinese name">
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả (Chinese)</label>
                <textarea id="poiDescZh" class="form-control" rows="3" placeholder="Chinese description"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('transModal')">Hủy</button>
            <button class="btn btn-primary" onclick="saveTrans()"><i class="fas fa-save"></i> Cập nhật bản dịch</button>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
    if (!TokenManager.isAuthenticated() && !localStorage.getItem('userSession')) {
        window.location.href = 'index';
    }

    let allPOIs = [];
    let filteredPOIs = [];
    let transPage = 1;
    const transPageSize = 5;

    async function loadData() {
        try {
            document.getElementById('transBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:3rem;color:#999"><i class="fas fa-spinner fa-spin fa-2x"></i></td></tr>';
            
            const listRes = await POIApi.list({ page: 1, pageSize: 200 });
            allPOIs = listRes.data || [];
            
            const total = allPOIs.length;
            const translatedEn = allPOIs.filter(p => typeof p.name_En === 'string' && p.name_En.trim() !== '').length;
            const translatedZh = allPOIs.filter(p => typeof p.name_Zh === 'string' && p.name_Zh.trim() !== '').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = translatedEn;
            document.getElementById('stat-zh').textContent = translatedZh;

            filteredPOIs = allPOIs.slice();
            renderCurrentTransPage();
        } catch(err) {
            console.error(err);
            document.getElementById('transBody').innerHTML = `<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> Lỗi khi tải dữ liệu</td></tr>`;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('transBody');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:3rem;color:#999">Không có dữ liệu địa điểm nào.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(p => {
            const vi = p.name_Vi || '—';
            const en = p.name_En ? `<span style="color:var(--success)">${p.name_En}</span>` : '<span style="color:#aaa"><i>Chưa dịch</i></span>';
            const zh = p.name_Zh ? `<span style="color:var(--primary)">${p.name_Zh}</span>` : '<span style="color:#aaa"><i>Chưa dịch</i></span>';

            return `
            <tr>
                <td style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:600;color:var(--secondary)">#${p.poI_ID}</td>
                <td><strong>${vi}</strong></td>
                <td>${en}</td>
                <td>${zh}</td>
                <td>
                    <div class="actions">
                        <button class="btn-icon" onclick="editTrans(${p.poI_ID})" title="Dịch"><i class="fas fa-edit"></i></button>
                    </div>
                </td>
            </tr>
            `;
        }).join('');
    }

    function renderCurrentTransPage() {
        const total = filteredPOIs.length;
        const totalPages = Math.max(1, Math.ceil(total / transPageSize));
        if (transPage > totalPages) transPage = totalPages;
        if (transPage < 1) transPage = 1;

        const start = (transPage - 1) * transPageSize;
        const items = filteredPOIs.slice(start, start + transPageSize);
        renderTable(items);

        const wrap = document.getElementById('transPagination');
        if (!total) {
            if (wrap) {
                wrap.style.display = 'none';
                wrap.innerHTML = '';
            }
            return;
        }

        if (wrap) wrap.style.display = 'flex';
        renderTransPagination(totalPages, transPage, total);
    }

    function renderTransPagination(totalPages, currentPageNum, totalItems) {
        const pagination = document.getElementById('transPagination');
        if (!pagination) return;

        let html = `
            <button class="pagination-btn" onclick="changeTransPage('prev')" ${currentPageNum === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>
        `;

        for (let i = 1; i <= Math.min(totalPages, 5); i++) {
            html += `<button class="pagination-btn ${i === currentPageNum ? 'active' : ''}" onclick="goToTransPage(${i})">${i}</button>`;
        }

        if (totalPages > 5) {
            html += `<span class="pagination-info">... ${totalPages}</span>`;
        }

        html += `
            <button class="pagination-btn" onclick="changeTransPage('next')" ${currentPageNum === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>
            <span class="pagination-info">${totalItems} POI</span>
        `;

        pagination.innerHTML = html;
    }

    function changeTransPage(direction) {
        if (direction === 'prev' && transPage > 1) {
            transPage--;
        } else if (direction === 'next') {
            transPage++;
        }
        renderCurrentTransPage();
    }

    function goToTransPage(page) {
        transPage = page;
        renderCurrentTransPage();
    }

    function filterData() {
        const s = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allPOIs;
        
        if (s) {
            filtered = filtered.filter(p => 
                (p.name_Vi && p.name_Vi.toLowerCase().includes(s)) ||
                (p.name_En && p.name_En.toLowerCase().includes(s)) ||
                (p.name_Zh && p.name_Zh.toLowerCase().includes(s))
            );
        }

        filteredPOIs = filtered;
        transPage = 1;
        renderCurrentTransPage();
    }

    function showToast(message, type = 'error', timeout = 3200) {
        if (!message) return;
        let wrap = document.getElementById('toastWrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'toastWrap';
            wrap.style.position = 'fixed';
            wrap.style.top = '1rem';
            wrap.style.right = '1rem';
            wrap.style.zIndex = '12000';
            wrap.style.display = 'flex';
            wrap.style.flexDirection = 'column';
            wrap.style.gap = '.5rem';
            document.body.appendChild(wrap);
        }
        const bg = type === 'success' ? '#0f766e' : type === 'warning' ? '#a16207' : '#b42318';
        const item = document.createElement('div');
        item.style.background = bg;
        item.style.color = '#fff';
        item.style.padding = '.7rem .95rem';
        item.style.borderRadius = '10px';
        item.style.fontWeight = '600';
        item.style.boxShadow = '0 10px 26px rgba(0,0,0,.18)';
        item.textContent = String(message);
        wrap.appendChild(item);
        setTimeout(() => item.remove(), timeout);
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function editTrans(id) {
        const p = allPOIs.find(x => x.poI_ID === id);
        if(!p) return;
        
        document.getElementById('modalTitle').textContent = `Dịch POI #${p.poI_ID}`;
        document.getElementById('poiId').value = p.poI_ID;
        
        // Gốc
        document.getElementById('poiNameVi').value = p.name_Vi || '';
        document.getElementById('poiDescVi').value = p.description_Vi || '';
        
        // Dịch
        document.getElementById('poiNameEn').value = p.name_En || '';
        document.getElementById('poiDescEn').value = p.description_En || '';
        document.getElementById('poiNameZh').value = p.name_Zh || '';
        document.getElementById('poiDescZh').value = p.description_Zh || '';
            if (window.UiFeedback?.toast) {
                window.UiFeedback.toast(message, type, timeout);
                return;
            }
        openModal('transModal');
    }

    async function saveTrans() {
        const id = document.getElementById('poiId').value;
        const data = {
            Name_En: document.getElementById('poiNameEn').value.trim(),
            Description_En: document.getElementById('poiDescEn').value.trim(),
            Name_Zh: document.getElementById('poiNameZh').value.trim(),
            Description_Zh: document.getElementById('poiDescZh').value.trim()
        };

        try {
            await POIApi.update(id, data);
            closeModal('transModal');
            loadData(); // reload bảng
        } catch(err) {
            showToast('Lỗi cập nhật: ' + err.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        if (window.UiFeedback?.toast) {
            window.UiFeedback.toast('Chức năng quản lý bản dịch đã được gỡ khỏi hệ thống.', 'warning', 2600);
        }
        window.location.href = 'dashboard';
    });
</script>
</body>
</html>

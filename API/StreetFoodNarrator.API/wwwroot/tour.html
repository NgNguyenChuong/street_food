<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tour - Street Food Narrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sidebar.js"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #004E89;
            --accent: #FFD23F;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --border: #E8ECF1;
            --shadow: rgba(26, 26, 46, 0.08);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(to bottom, #F0F4F8 0%, #FFFFFF 100%); color: var(--dark); overflow-x: hidden; }
        .main-content { margin-left: 130px; padding: 2rem; min-height: 100vh; transition: margin-left 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; animation: fadeIn 0.6s ease-out; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }

        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; }
        .btn-primary { background: var(--gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.3); }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.75rem; border-radius: 20px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s; position: relative; overflow: hidden; animation: fadeInUp 0.6s ease-out backwards; }
        .stat-card:nth-child(1) { animation-delay: 0.1s; } .stat-card:nth-child(2) { animation-delay: 0.2s; } .stat-card:nth-child(3) { animation-delay: 0.3s; } .stat-card:nth-child(4) { animation-delay: 0.4s; }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--gradient); opacity: 0.04; border-radius: 0 20px 0 100%; }
        .stat-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px var(--shadow); }
        .stat-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; }
        .stat-icon.primary { background: rgba(255,107,53,0.12); color: var(--primary); }
        .stat-icon.success { background: rgba(6,214,160,0.12); color: var(--success); }
        .stat-icon.secondary { background: rgba(0,78,137,0.12); color: var(--secondary); }
        .stat-icon.accent { background: rgba(255,210,63,0.12); color: #D69E00; }
        .stat-value { font-size: 2.25rem; font-weight: 700; color: var(--dark); margin-bottom: 0.35rem; }
        .stat-label { color: #666; font-size: 0.9rem; }

        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999; }
        .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.3s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }

        .tours-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .tour-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s; border: 1px solid var(--border); display: flex; flex-direction: column; cursor: pointer; }
        .tour-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(255,107,53,0.15); border-color: rgba(255,107,53,0.3); }
        .tour-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
        .tour-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: var(--dark); margin-bottom: 0.5rem; line-height: 1.3; }

        .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.active { background: rgba(6,214,160,0.15); color: var(--success); }
        .status-badge.draft { background: rgba(255,210,63,0.15); color: #D69E00; }

        .tour-body { padding: 1.5rem; flex: 1; }
        .tour-desc { color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .tour-meta { display: flex; gap: 1.25rem; color: #888; font-size: 0.85rem; font-weight: 500; }
        .meta-item { display: flex; align-items: center; gap: 0.4rem; }
        .meta-item i { color: var(--primary); }
        .tour-footer { padding: 1.25rem 1.5rem; background: var(--light); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }

        .btn-icon { width: 36px; height: 36px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; background: white; border: 1px solid var(--border); color: #666; font-size: 0.9rem; }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); background: rgba(255,107,53,0.05); }
        .btn-icon.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,71,111,0.05); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,26,46,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.3s; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; width: 90%; max-width: 600px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeInUp 0.4s ease-out; overflow: hidden; }
        .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .modal-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--dark); }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: #999; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 2rem; max-height: calc(100vh - 200px); overflow-y: auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--dark); }
        .form-control { width: 100%; padding: 0.875rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--gradient); }
        input:checked + .slider:before { transform: translateX(24px); }
        .modal-footer { padding: 1.5rem 2rem; background: var(--light); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .main-content { margin-left: 0; } }
    </style>
</head>
<body>
<main class="main-content" id="mainContent">
    <header class="header">
        <h1 class="page-title">Quản lý Tour</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openModal('modal-add')"><i class="fas fa-plus"></i> Tạo Tour mới</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-route"></i></div>
            <div class="stat-value" id="stat-total">&#8212;</div>
            <div class="stat-label">Tổng số Tour</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
            <div class="stat-value" id="stat-active">&#8212;</div>
            <div class="stat-label">Đang hoạt động</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon accent"><i class="fas fa-pencil-alt"></i></div>
            <div class="stat-value" id="stat-draft">&#8212;</div>
            <div class="stat-label">Bản nháp</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon secondary"><i class="fas fa-map-marker-alt"></i></div>
            <div class="stat-value" id="stat-pois">&#8212;</div>
            <div class="stat-label">Tổng POI liên kết</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm tên tour, mô tả..." oninput="filterTours()">
        </div>
    </div>

    <div class="tours-grid" id="toursGrid">
        <div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: #999;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
        </div>
    </div>
</main>

<!-- ADD/EDIT TOUR MODAL -->
<div class="modal-overlay" id="tourModal">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Tạo Tour mới</h2>
            <button class="modal-close" onclick="closeModal('tourModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="tourId">
            <div class="form-group">
                <label class="form-label">Tên Tour *</label>
                <input type="text" id="tourName" class="form-control" placeholder="vd: Tour Ẩm thực Quận 4">
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả</label>
                <textarea id="tourDesc" class="form-control" rows="4" placeholder="Khám phá các con phố ẩm thực nổi tiếng..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Thời lượng dự kiến (phút)</label>
                <input type="number" id="tourDuration" class="form-control" placeholder="vd: 45" value="30" min="1">
            </div>
            <div class="form-group" style="display:flex; align-items:center; justify-content:space-between; background:var(--light); padding:1rem; border-radius:12px; border:1px solid var(--border);">
                <div>
                    <label class="form-label" style="margin-bottom:0.25rem;">Trạng thái hoạt động</label>
                    <div style="font-size:0.85rem; color:#666;">Bật để cho phép người dùng nhìn thấy tour này</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="tourActive">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('tourModal')">Hủy</button>
            <button class="btn btn-primary" onclick="saveTour()"><i class="fas fa-save"></i> Lưu Tour</button>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
    if (!TokenManager.isAuthenticated() && !localStorage.getItem('userSession')) {
        window.location.href = 'index.html';
    }

    let allTours = [];

    async function loadTours() {
        try {
            document.getElementById('toursGrid').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: #999;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

            const [toursRes, statsRes] = await Promise.all([
                ToursApi.list({ page: 1, pageSize: 100 }),
                ToursApi.stats()
            ]);

            allTours = toursRes.data || [];

            document.getElementById('stat-total').textContent = statsRes.total || allTours.length;
            document.getElementById('stat-active').textContent = statsRes.active || allTours.filter(t => t.isActive).length;
            document.getElementById('stat-draft').textContent = statsRes.draft || allTours.filter(t => !t.isActive).length;
            document.getElementById('stat-pois').textContent = statsRes.totalPOIs || '\u2014';

            renderTours(allTours);
        } catch(err) {
            console.error(err);
            document.getElementById('toursGrid').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: var(--danger);"><i class="fas fa-exclamation-triangle fa-2x"></i><br>Lỗi khi tải dữ liệu. Vui lòng thử lại sau.</div>';
        }
    }

    function renderTours(data) {
        const grid = document.getElementById('toursGrid');
        if (!data.length) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: #999; background: white; border-radius: 20px; border: 1px dashed var(--border);"><h3>Chưa có Tour nào</h3><p>Hãy tạo một tour mới để bắt đầu.</p></div>';
            return;
        }
        grid.innerHTML = data.map(t => {
            const statusClass = t.isActive ? 'active' : 'draft';
            const statusLabel = t.isActive ? 'Bật' : 'Nháp';
            return `
            <div class="tour-card" onclick="viewTour('${t.id}')">
                <div class="tour-header">
                    <div>
                        <h3 class="tour-title">${t.tourName}</h3>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                </div>
                <div class="tour-body">
                    <p class="tour-desc">${t.description || '<em style="color:#aaa">Không có mô tả</em>'}</p>
                    <div class="tour-meta">
                        <div class="meta-item"><i class="far fa-clock"></i><span>${t.estimatedDurationMinutes || 0} phút</span></div>
                    </div>
                </div>
                <div class="tour-footer">
                    <button class="btn-icon" onclick="event.stopPropagation(); editTour('${t.id}')" title="Sửa"><i class="fas fa-edit"></i></button>
                    <button class="btn-icon del" onclick="event.stopPropagation(); deleteTour('${t.id}')" title="Xóa"><i class="fas fa-trash"></i></button>
                </div>
            </div>`;
        }).join('');
    }

    function filterTours() {
        const s = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allTours;
        if (s) {
            filtered = filtered.filter(t =>
                (t.tourName && t.tourName.toLowerCase().includes(s)) ||
                (t.description && t.description.toLowerCase().includes(s))
            );
        }
        renderTours(filtered);
    }

    function viewTour(id) {
        const t = allTours.find(x => x.id === id);
        if (!t) return;
        alert('CHI TIẾT TOUR\n\nTên: ' + t.tourName + '\nMô tả: ' + (t.description || 'Không có') + '\nThời lượng: ' + t.estimatedDurationMinutes + ' phút\nTrạng thái: ' + (t.isActive ? 'Đang hoạt động' : 'Bản nháp'));
    }

    function openModal(id) {
        if (id === 'modal-add') {
            document.getElementById('modalTitle').textContent = "Tạo Tour mới";
            document.getElementById('tourId').value = "";
            document.getElementById('tourName').value = "";
            document.getElementById('tourDesc').value = "";
            document.getElementById('tourDuration').value = "30";
            document.getElementById('tourActive').checked = false;
            id = 'tourModal';
        }
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function editTour(id) {
        const t = allTours.find(x => x.id === id);
        if (!t) return;
        document.getElementById('modalTitle').textContent = "Chỉnh sửa Tour";
        document.getElementById('tourId').value = t.id;
        document.getElementById('tourName').value = t.tourName || '';
        document.getElementById('tourDesc').value = t.description || '';
        document.getElementById('tourDuration').value = t.estimatedDurationMinutes || 30;
        document.getElementById('tourActive').checked = t.isActive;
        document.getElementById('tourModal').classList.add('active');
    }

    async function saveTour() {
        const id = document.getElementById('tourId').value;
        const data = {
            tourName: document.getElementById('tourName').value.trim(),
            description: document.getElementById('tourDesc').value.trim(),
            estimatedDurationMinutes: parseInt(document.getElementById('tourDuration').value) || 30,
            isActive: document.getElementById('tourActive').checked
        };
        if (!data.tourName) return alert("Tên Tour không được để trống!");
        try {
            if (id) { await ToursApi.update(id, data); }
            else { await ToursApi.create(data); }
            closeModal('tourModal');
            loadTours();
        } catch(err) { alert("Lỗi: " + err.message); }
    }

    async function deleteTour(id) {
        if (!confirm("Bạn có chắc muốn xóa tour này? Dữ liệu không thể khôi phục.")) return;
        try { await ToursApi.delete(id); loadTours(); }
        catch(err) { alert("Lỗi xóa: " + err.message); }
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        var role = (sessionStorage.getItem('activeRole') || localStorage.getItem('activeRole') || '').toLowerCase();
        if (role !== 'admin') { window.location.href = 'dashboard.html'; return; }
        loadTours();
    });
</script>
</body>
</html>
